global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orderbook
    metrics_path: /metrics
    static_configs:
      # "api" when the service runs in compose (profile "app"),
      # host.docker.internal when it runs on your machine via `make run`.
      - targets: ["api:9090", "host.docker.internal:9090"]

  - job_name: orderbook-worker
    metrics_path: /metrics
    static_configs:
      # "worker" in compose (profile "app"); host.docker.internal:9092 for
      # `make run-worker`.
      - targets: ["worker:9090", "host.docker.internal:9092"]
