# Starter alerting rules. Tune thresholds to your SLOs.
groups:
  - name: orderbook
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p99 latency above 1s on {{ $labels.route }}"

      - alert: DBPoolSaturated
        expr: db_pool_acquired_conns / db_pool_max_conns > 0.9
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Database connection pool is >90% utilised"

      - alert: InstanceDown
        expr: up{job="orderbook"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Instance {{ $labels.instance }} is down"

  - name: orderbook-events
    rules:
      - alert: EventsDeadLettered
        expr: increase(kafka_consumer_messages_total{outcome="dead_lettered"}[15m]) > 0
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.consumer }} dead-lettered events; inspect the DLQ topic (docs/cdc.md)"

      - alert: EventHandlerRetrying
        expr: sum by (consumer) (rate(kafka_consumer_messages_total{outcome="retried"}[5m])) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.consumer }} keeps retrying events (database or downstream trouble?)"

      # Replication slot lag on the Citus workers is the critical CDC alert,
      # but it comes from postgres_exporter on each node, not from this
      # service. With postgres_exporter's pg_replication_slots collector:
      #
      # - alert: ReplicationSlotLagHigh
      #   expr: pg_replication_slots_pg_wal_lsn_diff > 1e9
      #   for: 10m
      #   labels: { severity: page }

      - alert: WorkerDown
        expr: up{job="orderbook-worker"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Event worker {{ $labels.instance }} is down; projections are falling behind"
